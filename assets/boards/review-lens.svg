<rect width="1200" height="675" fill="#FFFFFF"/><text x="96" y="78" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="32px" font-weight="650" fill="#111111">一项数字，四层复核</text><text x="96" y="108" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">先核对数据和可比性，结论才有意义</text><line x1="96" y1="136" x2="1104" y2="136" stroke="#E8E8E8" stroke-width="1"/><circle cx="600" cy="366" r="88" fill="#2F6BFF"/><text x="600" y="358" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20px" font-weight="650" fill="#FFFFFF">分析</text><text x="600" y="385" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="20px" font-weight="650" fill="#FFFFFF">底稿</text><rect x="262" y="230" width="156" height="72" fill="none" stroke="#222222" stroke-width="1.5"/><text x="340" y="262" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">数据完整</text><text x="340" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">币种 · 周期</text><path d="M 422 266 C 500 266 510 366 510 366" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="782" y="230" width="156" height="72" fill="none" stroke="#222222" stroke-width="1.5"/><text x="860" y="262" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">带宽映射</text><text x="860" y="288" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">岗位 · 职级</text><path d="M 778 266 C 700 266 690 366 690 366" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="262" y="438" width="156" height="72" fill="none" stroke="#222222" stroke-width="1.5"/><text x="340" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">可比范围</text><text x="340" y="496" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">地点 · 样本</text><path d="M 422 474 C 500 474 510 366 510 366" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="782" y="438" width="156" height="72" fill="none" stroke="#222222" stroke-width="1.5"/><text x="860" y="470" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16px" font-weight="650" fill="#111111">市场时效</text><text x="860" y="496" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12px" font-weight="400" fill="#666666">来源 · 日期</text><path d="M 778 474 C 700 474 690 366 690 366" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="600" y1="230" x2="600" y2="254" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7"/><line x1="600" y1="478" x2="600" y2="502" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="5 7"/><text x="600" y="594" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14px" font-weight="400" fill="#666666">少一层核验，数字就不应被当作结论</text></svg>
